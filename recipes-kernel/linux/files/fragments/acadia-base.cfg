# Acadia kernel config fragment — deployment-specific kernel features.
#
# This file intentionally ships with no active CONFIG_ lines so it is a
# safe no-op by default. Add CONFIG_* options here for a specific
# deployment (e.g. a hardened/defense build, or a build that needs an
# extra CAN/industrial-bus driver) and they will be merged into the RPi
# kernel's .config automatically — see linux-raspberrypi_6.6.bbappend.
#
# Example:
# CONFIG_SECURITY_APPARMOR=y
# CONFIG_CAN_MCP251X=m
