# Acadia kernel config fragment — deployment-specific kernel features.
#
# This file ships with the industrial-bus / sensor / PWM kernel drivers
# that the task.md hardware-enablement pass requires.  Each CONFIG_* line
# is merged into the RPi kernel's .config automatically via
# linux-raspberrypi_6.6.bbappend (kernel-yocto fragment handling).
#
# To add a deployment-specific option, append a CONFIG_* line here (e.g.
# CONFIG_SECURITY_APPARMOR=y) and it will be merged into the kernel.

# ── CAN bus (task.md GPIO/Sensors/Industrial IO) ────────────────────────────
# SPI CAN transceiver (MCP2515) driver + core CAN stack.  The matching
# dtoverlay=mcp2515-can0 is set in kas/common.yaml (RPI_EXTRA_CONFIG).
CONFIG_CAN=y
CONFIG_CAN_RAW=y
CONFIG_CAN_BCM=y
CONFIG_CAN_DEV=y
CONFIG_CAN_MCP251X=y

# ── 1-Wire bus (task.md GPIO/Sensors/Industrial IO) ────────────────────────
# w1-gpio master + DS18B20-class temperature probe support.  The matching
# dtoverlay=w1-gpio is set in kas/common.yaml (RPI_EXTRA_CONFIG).
CONFIG_W1=y
CONFIG_W1_MASTER_GPIO=y
CONFIG_W1_SLAVE_THERM=y

# ── PWM (task.md GPIO/Sensors/Industrial IO) ────────────────────────────────
# BCM2835 PWM controller for actuator/motor-control test setups.  The
# matching dtoverlay=pwm is set in kas/common.yaml (RPI_EXTRA_CONFIG).
CONFIG_PWM=y
CONFIG_PWM_BCM2835=y

# ── GPIO expander (task.md GPIO/Sensors/Industrial IO) ─────────────────────
# I2C GPIO expanders (MCP23017 / PCF8574) for boards needing more digital
# IO than the 40-pin header exposes directly.
CONFIG_GPIO_PCF857X=y
CONFIG_GPIO_PCA953X=y

# ── Environmental sensors (task.md GPIO/Sensors/Industrial IO) ──────────────
# I2C temp/humidity/pressure sensors (BME280-class) used on IV&V rigs.
CONFIG_IIO=y
CONFIG_BME280=y
CONFIG_BME280_I2C=y
CONFIG_BME280_SPI=y

# ── RTC (task.md Power/Thermal) ────────────────────────────────────────────
# I2C RTC chips (PCF8523 / DS3231-class) for the battery header.  The
# matching dtoverlay=i2c-rtc,pcf8523 is set in kas/common.yaml.
CONFIG_RTC_DRV_PCF8523=y
CONFIG_RTC_DRV_DS1307=y

# ── Hardware watchdog (task.md Power/Thermal / OTA) ─────────────────────────
# BCM2835 watchdog timer for the /dev/watchdog hardware-reset story that
# complements the OTA boot-watchdog.sh boot-confirmation logic.
CONFIG_BCM2835_WDT=y
