# PREEMPT_RT (task 002) — full real-time preemption for the aarch64 Acadia
# kernel. Requires the upstream RT patch set (rt51, applied via SRC_URI in
# the bbappend); CONFIG_PREEMPT_RT only exists after that patch is applied.
# The 6.6-rt series adds PREEMPT_LAZY as a fifth preemption-model choice;
# only one choice member may be selected, so the non-RT members are unset
# explicitly to avoid stale values from the BSP defconfig (bcm2712_defconfig
# ships CONFIG_PREEMPT=y).
#
# Base config already provides (no need to duplicate):
#   CONFIG_HIGH_RES_TIMERS=y, CONFIG_HZ_250=y,
#   CONFIG_IRQ_FORCED_THREADING=y (forced-threaded IRQs are the RT default).
CONFIG_PREEMPT_RT=y
# CONFIG_PREEMPT_LAZY is not set
# CONFIG_PREEMPT is not set
# CONFIG_PREEMPT_VOLUNTARY is not set
# CONFIG_PREEMPT_NONE is not set