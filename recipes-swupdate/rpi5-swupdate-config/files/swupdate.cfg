globals:
{
    verbose      = true;
    loglevel     = 3;
    syslog       = false;
    no-downgrade = false;
    # Automatically reboot into the new slot after a successful update.
    # OS-016: the reboot carries the firmware "tryboot" flag so the new slot
    # is booted once via autoboot.txt's boot_prefix_try; a failed boot falls
    # back to the confirmed slot with zero userspace involvement.
    postupdatecmd = "/usr/lib/swupdate/reboot-tryboot.sh";
};

identify:
{
    name              = "rpi5";
    hardware-revision = "1.0";
};

download:
{
    retries = 3;
    timeout = 1800;        /* seconds */
};

# Issue #21: signed-image verification.
# The public key is installed to /etc/swupdate/swupdate-public.pem by
# the rpi5-swupdate-config recipe's do_install step.  swupdate-start.sh
# passes it to `swupdate -k`.  The matching private key lives in the
# build/CI vault only — `make swu` fails (exit 1) without it, because
# an unsigned .swu would be rejected on install.  For dev, override
# with `make swu SWU_ALLOW_UNSIGNED=1` (the target will still reject
# the .swu — the override is for iterating on the build pipeline).
#
# To regenerate the keypair on a developer workstation:
#   openssl genrsa -out meta/meta-acadia/swupdate/keys/swupdate-private.pem 4096
#   openssl rsa -in  meta/meta-acadia/swupdate/keys/swupdate-private.pem -pubout \
#        -out      meta/meta-acadia/recipes-swupdate/rpi5-swupdate-config/files/swupdate-public.pem
# The PRIVATE key is committed to the build/CI vault only — never to
# the repo.  The PUBLIC key is committed (placeholder above).
security:
{
    public-key = "/etc/swupdate/swupdate-public.pem";
};

