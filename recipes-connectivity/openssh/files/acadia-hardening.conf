# Acadia SSH hardening — applied to all Acadia devices.
# Included by /etc/ssh/sshd_config via:
#   Include /etc/ssh/sshd_config.d/*.conf

PasswordAuthentication no
ChallengeResponseAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
# T-P11 (B03/B05): the operator account is SSH-reachable, key-only.
AllowUsers rpi operator
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
GatewayPorts no
