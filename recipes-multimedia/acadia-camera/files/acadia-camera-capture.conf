# Set ENABLED=1 and choose a MODE before enabling the service.
#   MODE=local  renders the V4L2 frame to a local sink (GST_SINK).
#   MODE=udp    bridges the V4L2 device to an RTP/JPEG UDP stream for
#               IV&V test fixtures / remote viewers (see
#               hardware-enablement.md §2 for the far-end pipeline).
ENABLED=0
MODE=local
CAMERA_DEVICE=/dev/video0
CAPTURE_WIDTH=1280
CAPTURE_HEIGHT=720
CAPTURE_FPS=30

# Local-mode sink element (e.g. fakesink or autovideosink).
GST_SINK=fakesink

# UDP-mode destination (MODE=udp): stream is sent to STREAM_HOST:STREAM_PORT
# as RTP/JPEG.
STREAM_HOST=127.0.0.1
STREAM_PORT=5000
