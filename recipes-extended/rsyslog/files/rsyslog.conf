# Acadia rsyslog base configuration (meta-acadia, T-P29).
#
# journald is the log store. rsyslog reads the journal and forwards only what
# the rules in /etc/rsyslog.d/ say — WebConfig's remote-syslog setting writes
# /etc/rsyslog.d/50-webconfig-forward.conf. There are deliberately no local
# file actions: journald already persists logs and /var/log writes wear the
# SD card/eMMC.
global(workDirectory="/var/lib/rsyslog")
module(load="imjournal" StateFile="imjournal.state" IgnorePreviousMessages="on")

$IncludeConfig /etc/rsyslog.d/*.conf
