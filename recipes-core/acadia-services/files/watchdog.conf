# Acadia hardware watchdog configuration — /dev/watchdog via bcm2835-wdt.
#
# This configures the `watchdog` daemon (from the `watchdog` package) to
# drive the BCM2712 hardware watchdog timer.  It complements the OTA
# boot-watchdog.sh boot-confirmation logic: boot-watchdog.sh handles
# slot-confirmation/rollback, while this daemon provides a true
# "boot-confirm-or-hardware-reset" story — if the system hangs, the
# hardware watchdog resets it.
#
# The bcm2835-wdt kernel module is enabled in acadia-base.cfg
# (CONFIG_BCM2835_WDT=y).

# The watchdog device node.
watchdog-device = /dev/watchdog

# Interval (seconds) between writes to the watchdog.  Must be less than
# the hardware timeout so the daemon keeps the timer fed.
interval = 10

# Reboot the system if the watchdog daemon itself dies.
reboot = yes

# Log to syslog.
verbose = yes

# If the system is idle for this many seconds, the watchdog daemon will
# still feed the timer (no idle timeout — we never want a healthy idle
# system to reset).
# (No 'idle' directive: keep the watchdog fed unconditionally.)
