[Unit]
# Task 003 (Acadia-OS): acadia-pst-init.service chowns the freshly mounted
# /pst to instr-istate:instr and provisions the per-spoke store directories
# BEFORE istate creates its layout.  Mount-unit ordering
# (RequiresMountsFor=/pst) is already declared by the daemon unit itself —
# this drop-in only adds the ownership-bootstrap ordering.  On devices with
# the old 4-partition layout acadia-pst-init is condition-skipped; an
# After= on a skipped unit does not block istate.
After=acadia-pst-init.service